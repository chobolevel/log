<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>이메일 인증</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f5f5; padding: 48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color: #111111; padding: 28px 40px;">
              <p style="margin: 0; font-size: 20px; font-weight: 700; color: #ffffff; letter-spacing: -0.3px;">초로</p>
              <p style="margin: 4px 0 0; font-size: 12px; color: #888888; letter-spacing: 0.5px;">초보 개발자의 로그</p>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px 40px 32px;">
              <p style="margin: 0 0 8px; font-size: 22px; font-weight: 700; color: #111111; letter-spacing: -0.5px;">이메일 인증</p>
              <p style="margin: 0 0 32px; font-size: 14px; color: #666666; line-height: 1.6;">
                아래 인증 코드를 입력하면 이메일 인증이 완료됩니다.<br />
                코드는 <strong style="color: #111111;">5분간</strong> 유효합니다.
              </p>

              <!-- Code Box -->
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color: #f8f8f8; border: 1px solid #e8e8e8; border-radius: 8px; padding: 24px; text-align: center;">
                    <p style="margin: 0 0 6px; font-size: 11px; font-weight: 600; color: #999999; letter-spacing: 1.5px; text-transform: uppercase;">인증 코드</p>
                    <p style="margin: 0; font-size: 36px; font-weight: 700; color: #111111; letter-spacing: 10px; font-variant-numeric: tabular-nums;">{{code}}</p>
                  </td>
                </tr>
              </table>

              <p style="margin: 28px 0 0; font-size: 13px; color: #999999; line-height: 1.6;">
                본인이 요청하지 않은 경우 이 이메일을 무시하셔도 됩니다.<br />
                계정 보안을 위해 코드를 타인과 공유하지 마세요.
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 40px;">
              <hr style="border: none; border-top: 1px solid #eeeeee; margin: 0;" />
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 40px;">
              <p style="margin: 0; font-size: 12px; color: #bbbbbb; line-height: 1.6;">
                이 메일은 <a href="https://www.chobolevel.com" style="color: #bbbbbb; text-decoration: underline;">초로</a>에서 발송되었습니다.<br />
                문의사항은 no-reply@chobolevel.com 으로 연락해 주세요.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
