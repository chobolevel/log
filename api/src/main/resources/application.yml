server:
  port: 9565

logging:
  level:
    root: info
    org.hibernate.envers.boot: OFF

spring:
  application:
    name: chobolevel-log
  jpa:
    database: mysql
    open-in-view: false
    databse-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate.id.new_generator_mappings: false
      hibernate.implicit_naming_strategy: org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
      hibernate.physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      hibernate.globally_quoted_identifiers: true
      hibernate.globally_quoted_identifiers_skip_column_definitions: true
      # N+1 문제 일부 해결(옵션 값이 1000 관행으로 굳어진 이유는 Oracle IN절 1000개 제한이 있기 때문이며 옵션 값 계산은 페이지 크기 기준으로 최대 레코드 수)
      hibernate.default_batch_fetch_size: 1000
      org:
        hibernate:
          envers:
            revision_field_name: rev_id
            audit_table_suffix: _histories
            store_data_at_delete: true
      hibernate:
        show_sql: true
    generate-ddl: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: jdbc:mysql://localhost:3306/log
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: rkddlswo218@
  # spring-boot-starter-batch 의존성을 포함하는 경우 기본적으로 모든 Job을 애플리케이션 시작 시 자동 실행
  # 이는 JobLauncherApplicationRunner 컴포넌트 때문
  # 아래 설정으로 자동 실행을 막을 수 있음
  batch:
    job:
      enabled: false
  kafka:
    bootstrap-servers: ENC(uP+Xx3rfk1N4n95C4+U8YGksIRQ9xrDHgyX3idQxPs6wgGgaLUz7LYlI2UsApbfa)
    producer:
      acks: all
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ENC(M01eU4U0zBwO9/Qnsg0DD/W38lbTYqrF7Raq+6kM4Q181+g6Elht/eM/jCzlrlHai2nnygaRNin0tXZAylMrJg==)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # 역직렬화 실패(trusted-packages 위반, 손상된 메시지 등)가 poll() 단계에서 그대로 터지면
      # DefaultErrorHandler가 처리할 수 없어 컨슈머 스레드가 같은 offset에서 영구적으로 멈춘다.
      # ErrorHandlingDeserializer가 예외를 잡아 DeserializationException으로 감싸주면 @RetryableTopic이
      # 정상적으로 DLQ 라우팅 + offset 커밋까지 처리할 수 있다.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.chobolevel.api.*"
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ENC(aNYjVeV/XYpu2UF4lwkU9o0YU/Fc2zC7Vxoz49efWlSfFq+2RH4nYkOD3Le1lQyHxy+jH2VhjShNBWairQU9BA==)
    password: ENC(EQ6YpplFR/5Es9fbdxZqnEXzgrSfU6DtRjh6RPHFdjCA6DgwYflX6pR92U04FsjgQjATnq3vS2DLpPFd3/JYUg==)
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true
  jackson:
    property-naming-str ategy: SNAKE_CASE

jasypt:
