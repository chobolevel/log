server:
  reactive:
    session:
      cookie:
        path: "/"
        max-age: 31536000
        domain: localhost
        secure: false
        http-only: true
        same-site: none
        access-token-key: _cat
        refresh-token-key: _crt

logging:
  config: classpath:logback-test-spring.xml

spring:
  test:
    database:
      # @DataJpaTest 기본값인 replace=ANY는 spring.datasource.url을 무시하고 자체 H2 URL을 생성한다.
      # replace=none으로 비활성화해 아래 datasource.url이 실제로 적용되게 한다.
      replace: none
  datasource:
    # CASE_INSENSITIVE_IDENTIFIERS=TRUE: H2에서 quoted("deleted")와 unquoted(deleted) 식별자를
    # 대소문자 무감각하게 동일시한다.
    # @Where(clause = "deleted = false")의 unquoted 'deleted'가 Hibernate가 생성한
    # quoted "deleted" 칼럼과 매칭되도록 하기 위해 필요하다.
    # DB 이름을 컨텍스트마다 고유하게 한다(${random.uuid}는 Environment마다 한 번 풀린다).
    # 이름이 같으면 ddl-auto: create-drop이 컨텍스트가 닫힐 때(Spring 테스트 컨텍스트 캐시가 한도를 넘어 오래된 컨텍스트를 닫을 때)
    # 공유 DB의 테이블을 DROP해서, 캐시에 남은 다른 H2 컨텍스트가 "Table not found"로 실패한다.
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    # H2는 마이그레이션 SQL의 log. 스키마 참조를 지원하지 않는다.
    # ddl-auto: create-drop으로 Hibernate가 스키마를 생성하므로 Flyway는 비활성화한다.
    enabled: false
